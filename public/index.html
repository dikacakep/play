<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GarudaPS HOST - Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #0088ff;
            --dark: #0a0e27;
            --darker: #050811;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--darker);
            color: var(--primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background grid */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        /* Glowing orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 2;
            animation: float 20s ease-in-out infinite;
        }

        .orb1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .orb2 {
            width: 300px;
            height: 300px;
            background: var(--secondary);
            bottom: -150px;
            right: -150px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-50px, 50px) scale(0.9);
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }

        /* Status indicator */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 2rem;
            padding: 0.8rem 1.5rem;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid var(--primary);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            animation: slideDown 1s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }

        .pulse-dot::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--primary);
            animation: pulseRing 2s ease-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(0, 255, 136, 0);
            }
        }

        @keyframes pulseRing {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        .status-text {
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
        }

        /* Main title */
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3rem, 12vw, 7rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, var(--primary) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite, glitchTitle 5s ease-in-out infinite;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            position: relative;
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes glitchTitle {
            0%, 90%, 100% {
                transform: translate(0);
            }
            92% {
                transform: translate(-2px, 2px);
            }
            94% {
                transform: translate(2px, -2px);
            }
            96% {
                transform: translate(-2px, -2px);
            }
        }

        /* Subtitle */
        .subtitle {
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 300;
            color: rgba(0, 255, 136, 0.6);
            letter-spacing: 8px;
            text-transform: uppercase;
            animation: fadeIn 1.5s ease-out 0.5s both;
            margin-bottom: 3rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Decorative lines */
        .line-decoration {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                var(--primary) 20%, 
                var(--secondary) 50%, 
                var(--primary) 80%, 
                transparent 100%);
            position: relative;
            margin: 3rem 0;
            animation: lineGlow 2s ease-in-out infinite alternate;
        }

        @keyframes lineGlow {
            from {
                opacity: 0.3;
                box-shadow: 0 0 10px var(--primary);
            }
            to {
                opacity: 1;
                box-shadow: 0 0 30px var(--primary);
            }
        }

        .line-decoration::before,
        .line-decoration::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 15px var(--primary);
        }

        .line-decoration::before {
            left: 0;
            animation: dotPulse 2s ease-in-out infinite;
        }

        .line-decoration::after {
            right: 0;
            animation: dotPulse 2s ease-in-out infinite 1s;
        }

        @keyframes dotPulse {
            0%, 100% {
                transform: translateY(-50%) scale(1);
            }
            50% {
                transform: translateY(-50%) scale(1.5);
            }
        }

        /* System info */
        .system-info {
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
            animation: fadeIn 2s ease-out 1s both;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .info-label {
            font-size: 0.9rem;
            color: rgba(0, 255, 136, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .info-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            .status-indicator {
                padding: 0.6rem 1.2rem;
                gap: 10px;
            }

            .status-text {
                font-size: 0.85rem;
            }

            .subtitle {
                letter-spacing: 4px;
                margin-bottom: 2rem;
            }

            .system-info {
                gap: 2rem;
            }

            .orb1, .orb2 {
                width: 250px;
                height: 250px;
            }
        }

        @media (max-width: 480px) {
            .subtitle {
                letter-spacing: 2px;
            }

            .line-decoration {
                margin: 2rem 0;
            }

            .system-info {
                gap: 1.5rem;
            }

            .info-value {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background -->
    <div class="grid-bg"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- Main content -->
    <div class="container">
        <div class="status-indicator">
            <div class="pulse-dot"></div>
            <span class="status-text">System Active</span>
        </div>

        <h1 class="title">GarudaPS<br>HOST</h1>
        <p class="subtitle">is online</p>

        <div class="line-decoration"></div>

        <div class="system-info">
            <div class="info-item">
                <span class="info-label">Status</span>
                <span class="info-value">ONLINE</span>
            </div>
            <div class="info-item">
                <span class="info-label">Latency</span>
                <span class="info-value" id="latency">< 1ms</span>
            </div>
            <div class="info-item">
                <span class="info-label">Uptime</span>
                <span class="info-value">99.9%</span>
            </div>
        </div>
    </div>

    <script>
        // Simple latency animation
        const latencyEl = document.getElementById('latency');
        setInterval(() => {
            const randomLatency = Math.floor(Math.random() * 3) + 1;
            latencyEl.textContent = `< ${randomLatency}ms`;
        }, 3000);
    </script>
</body>
</html>
